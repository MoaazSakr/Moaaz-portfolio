<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moaaz Sakr - Resume</title>
    <link href="[https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap](https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap)" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #1D1616;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: #130f0f;
            border-bottom: 1px solid rgba(216, 64, 64, 0.2);
        }
        .top-bar a {
            color: #EEEEEE;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #D84040;
            transition: all 0.3s ease;
        }
        .top-bar a:hover {
            background-color: #D84040;
            color: #fff;
        }
        .btn-download {
            background-color: #8E1616; 
            border-color: #8E1616 !important;
        }
        .cv-container {
            width: 100%;
            height: calc(100% - 66px);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="index.html">&larr; Back to Portfolio</a>
        <!-- تأكد أن السيرة الذاتية المرفوعة بهذا الاسم بالضبط -->
        <a href="MoaazSakrResume.pdf" download class="btn-download">Download PDF Directly</a>
    </div>
    
    <div class="cv-container">
        <!-- عرض السيرة الذاتية هنا -->
        <iframe src="MoaazSakrResume.pdf">
            <p style="color: white; text-align: center; margin-top: 50px;">
                Your browser does not support PDF viewing. 
                <a href="MoaazSakrResume.pdf" download style="color: #D84040;">Download it here</a>.
            </p>
        </iframe>
    </div>
</body>
</html>
